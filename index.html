<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catch My Hearts ❤️</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{

    margin:0;
    overflow:hidden;

    background:
    radial-gradient(circle at top,#76278f,#09050d 70%);

    color:white;
    font-family:Arial,sans-serif;
    text-align:center;

}


h1{

    margin:8px;

    color:#ff91c8;

    text-shadow:
    0 0 15px #ff3e96;

}



#hud{

    display:flex;

    justify-content:center;

    gap:30px;

    font-size:20px;

}



#game{

    position:relative;

    width:min(95vw,600px);

    height:75vh;

    margin:auto;

    overflow:hidden;

    border:3px solid #ff75c8;

    border-radius:20px;


    background:

    linear-gradient(
    #29103d,
    #07050b
    );


    box-shadow:
    0 0 30px #ff3e96;

}



#world{

    position:absolute;

    width:100%;

    height:5000px;

    bottom:0;

}



#player{

    position:absolute;

    width:55px;

    height:55px;

    border-radius:50%;


    background-image:url("IMG_9350.jpg");

    background-size:cover;

    background-position:center;


    border:3px solid white;


    box-shadow:

    0 0 15px #ff4e9d,
    0 0 30px #ff4e9d;


    z-index:20;

    transition:
    opacity .3s;

}




.platform{

    position:absolute;

    height:18px;

    border-radius:15px;


    background:

    linear-gradient(
    90deg,
    #7628a5,
    #ff73d1
    );


    box-shadow:

    0 0 15px #ff4ccf;

}




.collectible{


    position:absolute;

    width:70px;

    height:50px;


    animation:
    float 1s infinite alternate;


    z-index:10;

}




.stef{


    width:42px;

    height:42px;


    border-radius:50%;


    background-image:url("stef.jpg");


    background-size:120%;

    background-position:center 65%;

    background-repeat:no-repeat;


    border:

    2px solid white;


    box-shadow:

    0 0 12px #ff4e9d;


}



.collectible span{


    position:absolute;

    right:0;

    top:-5px;


    font-size:28px;


    filter:

    drop-shadow(
    0 0 7px pink
    );


}




@keyframes float{


from{

transform:translateY(0);

}


to{

transform:translateY(-8px);

}


}




#controls{


    margin-top:10px;

}



button{


    width:90px;

    height:55px;

    margin:5px;


    border:0;


    border-radius:15px;


    background:#dc3988;


    color:white;


    font-size:25px;

}




#endScreen{


    display:none;


    position:absolute;


    inset:0;


    z-index:100;


    background:

    rgba(0,0,0,.85);


    justify-content:center;

    align-items:center;

    flex-direction:column;


}



#endScreen h2{


    color:#ff91c8;

    font-size:40px;


}



#endScreen a{


    background:#e63d8f;


    padding:15px 30px;


    border-radius:30px;


    color:white;


    text-decoration:none;


}



</style>

</head>


<body>


<h1>Catch My Hearts ❤️</h1>


<div id="hud">

<div>
❤️ <span id="score">0</span>/30
</div>


<div>

Lives:

<span id="lives">
❤️❤️❤️
</span>

</div>


</div>



<div id="game">


<div id="world">


<div id="player"></div>


</div>



<div id="endScreen">


<h2 id="endTitle">
Bravo Milana ❤️
</h2>


<p id="endText">
You found all my hearts 🥹
</p>



<a href="https://stefxdd.github.io/MilanaEstiBravo">
Continue ❤️
</a>


</div>


</div>



<div id="controls">


<button id="left">
←
</button>


<button id="jump">
↑
</button>


<button id="right">
→
</button>


</div>



<script>
  const game = document.getElementById("game");
const world = document.getElementById("world");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const livesText = document.getElementById("lives");

const endScreen = document.getElementById("endScreen");
const endTitle = document.getElementById("endTitle");
const endText = document.getElementById("endText");


let x = 270;
let y = 120;

let vx = 0;
let vy = 0;

let camera = 0;

let score = 0;
let lives = 3;

let gameFinished = false;
let falling = false;


let left = false;
let right = false;


const gravity = -0.55;
const jumpPower = 14;



let lastSafeX = x;
let lastSafeY = y;



/* CREATE PLATFORMS */

let platforms = [];


for(let i = 0; i < 55; i++){

    let platform = document.createElement("div");

    platform.className = "platform";


    platform.style.left =
    Math.random()*75 + "%";


    platform.style.bottom =
    (i*90) + "px";


    platform.style.width =
    (20 + Math.random()*25) + "%";


    world.appendChild(platform);

    platforms.push(platform);

}




/* CREATE HEARTS */

for(let i = 1; i <= 30; i++){

    let heart = document.createElement("div");

    heart.className = "collectible";


    heart.style.left =
    Math.random()*80 + "%";


    heart.style.bottom =
    (i*150+80)+"px";


    heart.innerHTML = `

    <div class="stef"></div>

    <span>❤️</span>

    `;


    world.appendChild(heart);

}





function updateLives(){

    livesText.innerHTML =
    "❤️".repeat(lives)+
    "🖤".repeat(3-lives);

}





function respawn(){

    falling = false;

    player.style.opacity = "1";


    x = lastSafeX;

    y = lastSafeY + 80;


    vy = 8;

}




function loseLife(){

    if(gameFinished)
    return;


    lives--;

    updateLives();


    player.style.opacity="0";


    falling=true;


    if(lives <= 0){


        gameFinished=true;


        setTimeout(()=>{


            endScreen.style.display="flex";


            endTitle.innerHTML =
            "Game Over 😭";


            endText.innerHTML =
            "Try again ❤️";


        },1000);


        return;

    }



    setTimeout(()=>{

        respawn();

    },1000);


}




function win(){


    if(gameFinished)
    return;


    gameFinished=true;


    endScreen.style.display="flex";


    endTitle.innerHTML =
    "Bravo Milana ❤️";


    endText.innerHTML =
    "You found all my hearts 🥹";


}







function update(){


if(gameFinished){

requestAnimationFrame(update);

return;

}



if(left)

vx=-5;

else if(right)

vx=5;

else

vx*=0.8;



vy += gravity;



x += vx;

y += vy;



if(x<0)

x=0;


if(x>game.clientWidth-55)

x=game.clientWidth-55;





let landed=false;



platforms.forEach(platform=>{


let px = platform.offsetLeft;

let py =
platform.offsetTop;



if(

x+55 > px &&

x < px+platform.offsetWidth &&


y <= py+18 &&

y >= py-10 &&

vy < 0

){


y = py+18;


vy = jumpPower;


landed=true;


lastSafeX=x;

lastSafeY=y;


}


});





/* CAMERA */


if(y-camera > 300){


camera = y-300;


world.style.bottom =
-camera+"px";


}





/* FALL OFF MAP */


if(y < camera-200 && !falling){


loseLife();


}





/* COLLECT HEARTS */


document.querySelectorAll(".collectible")
.forEach(item=>{


let ix=item.offsetLeft;

let iy=item.offsetTop;



if(

x+55 > ix &&

x < ix+70 &&

y+55 > iy &&

y < iy+50

){


item.remove();


score++;


scoreText.innerHTML =
score;



if(score>=30)

win();


}



});





player.style.left =
x+"px";


player.style.bottom =
y+"px";



requestAnimationFrame(update);


}







/* CONTROLS */


document.addEventListener("keydown",e=>{


if(e.key==="ArrowLeft")

left=true;


if(e.key==="ArrowRight")

right=true;


if(e.key==="ArrowUp" && !falling)

vy=jumpPower;


});



document.addEventListener("keyup",e=>{


if(e.key==="ArrowLeft")

left=false;


if(e.key==="ArrowRight")

right=false;


});





function hold(btn,press,release){


btn.addEventListener("pointerdown",e=>{

e.preventDefault();

press();

});


btn.addEventListener("pointerup",release);

btn.addEventListener("pointerleave",release);

}




hold(

document.getElementById("left"),

()=>left=true,

()=>left=false

);



hold(

document.getElementById("right"),

()=>right=true,

()=>right=false

);




document.getElementById("jump")
.addEventListener("pointerdown",()=>{

if(!falling)

vy=jumpPower;

});





update();
  </script>

</body>
</html>
