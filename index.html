<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catch My Hearts ❤️</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{

    margin:0;
    overflow:hidden;

    background:
    radial-gradient(circle at top,#6d287f,#09050d 70%);

    font-family:Arial,sans-serif;
    color:white;
    text-align:center;

}


h1{

    margin:8px;

    color:#ff8fc1;

    text-shadow:
    0 0 15px #ff3e96;

}


#hud{

    display:flex;
    justify-content:center;
    gap:30px;

    font-size:20px;

}


#game{

    position:relative;

    width:min(95vw,600px);
    height:75vh;

    margin:auto;

    overflow:hidden;

    border:
    3px solid #ff77c8;

    border-radius:20px;


    background:

    linear-gradient(
    #28103d,
    #08050d
    );

    box-shadow:
    0 0 30px #ff3e96;

}


/* scrolling world */

#world{

    position:absolute;

    width:100%;
    height:3000px;

    bottom:0;

}


/* platforms */

.platform{

    position:absolute;

    height:18px;

    background:
    linear-gradient(
    90deg,
    #7628a5,
    #ff73d1
    );


    border-radius:15px;

    box-shadow:
    0 0 15px #ff4ccf;

}


/* player */


#player{

    position:absolute;

    width:55px;
    height:55px;


    border-radius:50%;


    background-image:
    url("IMG_9350.jpg");


    background-size:cover;
    background-position:center;


    border:
    3px solid white;


    box-shadow:

    0 0 15px #ff4e9d,
    0 0 30px #ff4e9d;

}



/* hearts */


.collectible{

    position:absolute;

    width:50px;
    height:45px;


    animation:
    float 1s infinite alternate;

}


.heart{

    position:absolute;

    right:0;
    top:0;

    font-size:25px;

}



@keyframes float{

from{
transform:translateY(0);
}

to{
transform:translateY(-8px);
}

}



/* stef special */


.stef{

    width:38px;
    height:38px;

    border-radius:50%;

    background-image:
    url("stef.jpg");

    background-size:cover;

    border:
    2px solid white;

}


/* controls */


#controls{

    margin-top:10px;

}


button{

    width:90px;
    height:55px;

    margin:5px;

    border:0;

    border-radius:15px;

    background:#d93689;

    color:white;

    font-size:25px;

}



/* end */

#endScreen{

    display:none;

    position:absolute;

    inset:0;

    background:
    rgba(0,0,0,.85);


    justify-content:center;
    align-items:center;

    flex-direction:column;

}


#endScreen h2{

    color:#ff8fc1;

    font-size:40px;

}


a{

    background:#e63d8f;

    padding:15px 30px;

    border-radius:30px;

    color:white;

    text-decoration:none;

}


</style>

</head>


<body>


<h1>Catch My Hearts ❤️</h1>


<div id="hud">

<div>
❤️ <span id="score">0</span>/30
</div>

<div>
Lives:
<span id="lives">❤️❤️❤️</span>
</div>

</div>


<div id="game">


<div id="world">


<div id="player"></div>


</div>


<div id="endScreen">

<h2>
Bravo Milana ❤️
</h2>

<p>
You found all my hearts 🥹
</p>


<a href="https://stefxdd.github.io/MilanaEstiBravo/LoveYouMilana.html">
Continue ❤️
</a>


</div>


</div>



<div id="controls">

<button id="left">←</button>

<button id="jump">↑</button>

<button id="right">→</button>

</div>
