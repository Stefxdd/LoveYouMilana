<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catch My Hearts ❤️</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{

margin:0;
overflow:hidden;

background:
radial-gradient(circle at top,#76278f,#09050d 70%);

color:white;
font-family:Arial,sans-serif;
text-align:center;

}


h1{

margin:8px;

color:#ff91c8;

text-shadow:0 0 15px #ff3e96;

}



#hud{

display:flex;

justify-content:center;

gap:30px;

font-size:20px;

}




#game{

position:relative;

width:min(95vw,600px);

height:75vh;

margin:auto;

overflow:hidden;

border:3px solid #ff75c8;

border-radius:20px;


background:

linear-gradient(#29103d,#07050b);


box-shadow:0 0 30px #ff3e96;

}





#world{

position:absolute;

width:100%;

height:10000px;

bottom:0;

}





#player{

position:absolute;

width:55px;

height:55px;

border-radius:50%;


background-image:url("IMG_9350.jpg");

background-size:cover;

background-position:center;


border:3px solid white;


box-shadow:

0 0 15px #ff4e9d,
0 0 30px #ff4e9d;


z-index:20;

}




.falling{

animation:fallAway 1s forwards;

}




@keyframes fallAway{


0%{

transform:rotate(0deg) scale(1);

opacity:1;

}


100%{

transform:

rotate(720deg)
translateY(180px)
scale(.3);

opacity:0;

}


}




.platform{

position:absolute;

height:18px;

border-radius:15px;


background:

linear-gradient(
90deg,
#7628a5,
#ff73d1
);


box-shadow:

0 0 15px #ff4ccf;

}





.collectible{

position:absolute;

width:70px;

height:50px;


animation:float 1s infinite alternate;


z-index:10;

}





.stef{

width:42px;

height:42px;

border-radius:50%;


background-image:url("stef.jpg");


background-size:120%;


background-position:center 65%;


background-repeat:no-repeat;


border:2px solid white;


box-shadow:

0 0 12px #ff4e9d;

}





.collectible span{

position:absolute;

right:0;

top:-5px;


font-size:28px;


filter:drop-shadow(0 0 7px pink);

}





@keyframes float{


from{

transform:translateY(0);

}


to{

transform:translateY(-8px);

}


}




#controls{

margin-top:10px;

}





button{

width:90px;

height:55px;

margin:5px;


border:0;

border-radius:15px;


background:#dc3988;


color:white;


font-size:25px;

}




#endScreen{

display:none;


position:absolute;


inset:0;


z-index:100;


background:rgba(0,0,0,.85);


justify-content:center;


align-items:center;


flex-direction:column;


}




#endScreen h2{

color:#ff91c8;

font-size:40px;

}




#endScreen a{

background:#e63d8f;


padding:15px 30px;


border-radius:30px;


color:white;


text-decoration:none;


}


</style>

</head>


<body>


<h1>Catch My Hearts ❤️</h1>



<div id="hud">


<div>

❤️ <span id="score">0</span>/30

</div>


<div>

Lives:

<span id="lives">

❤️❤️❤️

</span>


</div>


</div>





<div id="game">


<div id="world">


<div id="player"></div>


</div>





<div id="endScreen">


<h2 id="endTitle">

Bravo Milana ❤️

</h2>


<p id="endText">

You found all my hearts 🥹

</p>



<a id="endButton" href="#">

Continue ❤️

</a>


</div>


</div>





<div id="controls">


<button id="left">

←

</button>


<button id="jump">

↑

</button>


<button id="right">

→

</button>


</div>
<script>

const game = document.getElementById("game");
const world = document.getElementById("world");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const livesText = document.getElementById("lives");

const endScreen = document.getElementById("endScreen");
const endTitle = document.getElementById("endTitle");
const endText = document.getElementById("endText");
const endButton = document.getElementById("endButton");


let x = 270;
let y = 80;

let vx = 0;
let vy = 0;

let camera = 0;

let score = 0;
let lives = 3;

let falling = false;
let gameFinished = false;

let grounded = false;

let left=false;
let right=false;


const gravity=-0.55;
const jumpPower=14;



let lastSafeX=x;
let lastSafeY=40;



let platforms=[];



for(let i=0;i<80;i++){

let platform=document.createElement("div");

platform.className="platform";


platform.style.width =
(100+Math.random()*90)+"px";


platform.style.left =
(15+Math.random()*60)+"%";


platform.style.bottom =
(i*110)+"px";



world.appendChild(platform);


platforms.push(platform);


}






function updateLives(){

livesText.innerHTML =
"❤️".repeat(lives)+
"🖤".repeat(3-lives);

}







function respawn(){

player.classList.remove("falling");

x=lastSafeX;

y=lastSafeY+25;


vx=0;

vy=0;


camera=Math.max(0,lastSafeY-300);


world.style.bottom=-camera+"px";


player.style.opacity="1";

player.style.transform="none";


falling=false;

}







function loseLife(){


if(gameFinished || falling)

return;



lives--;


updateLives();



falling=true;


player.classList.add("falling");





if(lives<=0){


gameFinished=true;



setTimeout(()=>{


endScreen.style.display="flex";


endTitle.innerHTML="Game Over 😭";


endText.innerHTML="You almost got them ❤️";


// ONLY RESTART BUTTON

endButton.innerHTML="Try Again 🔄";

endButton.removeAttribute("href");


endButton.onclick=function(e){

e.preventDefault();

location.reload();

};


},1000);



return;


}






setTimeout(()=>{


respawn();


},1000);



}








function win(){


if(gameFinished)

return;



gameFinished=true;



endScreen.style.display="flex";


endTitle.innerHTML="Bravo Milana ❤️";


endText.innerHTML="You found all my hearts 🥹";



endButton.innerHTML="Continue ❤️";


endButton.href="https://stefxdd.github.io/MilanaEstiBravo/";


endButton.onclick=function(){

window.location.href=
"https://stefxdd.github.io/MilanaEstiBravo/";

};



}









function update(){



if(gameFinished){

requestAnimationFrame(update);

return;

}





grounded=false;





if(left)

vx=-5;


else if(right)

vx=5;


else

vx*=0.8;





vy+=gravity;


x+=vx;


y+=vy;






if(x<0)

x=0;



if(x>game.clientWidth-55)

x=game.clientWidth-55;







platforms.forEach(platform=>{


let px=platform.offsetLeft;


let py=parseInt(platform.style.bottom);






if(

x+55>px &&

x<px+platform.offsetWidth &&


y<=py+18 &&

y>=py-15 &&


vy<0

){


y=py+18;


vy=jumpPower;


grounded=true;



if(y>lastSafeY){


lastSafeX=x;


lastSafeY=y;


}


}



});







if(y-camera>300){


camera=y-300;


world.style.bottom=-camera+"px";


}







if(y<camera-250 && !falling){


loseLife();


}






player.style.left=x+"px";


player.style.bottom=y+"px";



requestAnimationFrame(update);



}
    // HEARTS

let hearts=[];


platforms.forEach((platform,index)=>{


// create enough hearts but keep spacing

if(index % 2 === 0 && hearts.length < 50){


let heart=document.createElement("div");


heart.className="collectible";



let px = platform.offsetLeft;

let py = parseInt(platform.style.bottom);



// place heart above platform

heart.style.left =
(px + platform.offsetWidth/2 - 25) + "px";


heart.style.bottom =
(py + 35) + "px";




heart.innerHTML=`

<div class="stef"></div>

<span>❤️</span>

`;



world.appendChild(heart);


hearts.push(heart);



}


});









function collectHearts(){


hearts.forEach((heart,index)=>{


if(!heart)

return;



let ix=heart.offsetLeft;


let iy=parseInt(heart.style.bottom);






if(

x+55>ix &&

x<ix+70 &&


y+55>iy &&

y<iy+50

){


heart.remove();


hearts[index]=null;



score++;


scoreText.innerHTML=score;




if(score>=30){


win();


}



}



});


}









// add collecting to game loop

const oldUpdate=update;


update=function(){


collectHearts();


oldUpdate();


};









// KEYBOARD CONTROLS


document.addEventListener("keydown",e=>{


if(e.key==="ArrowLeft")

left=true;



if(e.key==="ArrowRight")

right=true;





if(

e.key==="ArrowUp" &&

grounded &&

!falling

){


vy=jumpPower;


grounded=false;


}


});











document.addEventListener("keyup",e=>{


if(e.key==="ArrowLeft")

left=false;



if(e.key==="ArrowRight")

right=false;



});









// MOBILE BUTTONS


function hold(button,press,release){


button.addEventListener("pointerdown",e=>{


e.preventDefault();


press();


});



button.addEventListener("pointerup",release);


button.addEventListener("pointerleave",release);


}








hold(

document.getElementById("left"),

()=>left=true,

()=>left=false

);









hold(

document.getElementById("right"),

()=>right=true,

()=>right=false

);









document.getElementById("jump")
.addEventListener("pointerdown",()=>{


if(grounded && !falling){


vy=jumpPower;


grounded=false;


}


});









update();


</script>


</body>

</html>
